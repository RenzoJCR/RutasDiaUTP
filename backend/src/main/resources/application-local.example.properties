# =====================================================
# Base de datos local
# Copiar este archivo como application-local.properties
# y completar las credenciales locales.
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3307/rutas_dia_utp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima

spring.datasource.username=diautp
spring.datasource.password=CAMBIAR_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
app.jwt.secret=CAMBIAR_POR_UNA_CLAVE_DE_MINIMO_32_CARACTERES
app.jwt.expiration-minutes=720


# =====================================================
# Administrador inicial
# Solo se utiliza cuando todavia no existe ningun admin.
# =====================================================

app.initial-admin.enabled=false


# =====================================================
# Frontend / recuperación de contraseña
# =====================================================

app.frontend-url=http://localhost:5173

app.password-reset.expiration-minutes=30

# En desarrollo se imprime el enlace en consola.
app.mail.enabled=false
app.mail.from=no-reply@utp.edu.pe


